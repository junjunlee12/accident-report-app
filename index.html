<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x1F6A8;</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>사고 발생보고서</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // 백그라운드에서 API 서버 깨우기 (화면은 즉시 표시)
      (function() {
        var API_URL = 'https://accident-report-app.onrender.com';
        fetch(API_URL + '/api/health').catch(function() {
          // 첫 시도 실패는 무시. 서버가 깨어나면 자동으로 응답함
          setTimeout(function() {
            fetch(API_URL + '/api/health').catch(function() {});
          }, 5000);
        });
      })();
    </script>
  </body>
</html>
